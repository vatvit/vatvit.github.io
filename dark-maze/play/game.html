    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: grid; place-items: center; }

      /* NOTHING IN THIS PAGE IS SELECTABLE (MAZE-239).
         A game is not a document. Two panels already said this for themselves —
         `[data-chrome]` and `#dpad .key` — which left the rule true of the
         chrome and false of everything under it: a drag across the maze
         selected, and on a handset a long press raised the magnifier and the
         selection handles over the picture. Said once, at the root, and
         inherited; the two local copies are gone.

         `-webkit-touch-callout` kills iOS's press-and-hold sheet, and the tap
         highlight is the grey flash Android paints over anything it thinks is a
         link. Neither has a standard equivalent, which is why both are here
         with prefixes and no unprefixed partner. */
      html {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { image-rendering: pixelated; display: block; }

      /* Wraps the canvas so the control panels can sit at the top-right of the
         GAME rather than of the window — the canvas is letterboxed and integer
         scaled, so at most sizes those are different corners. */
      #stage { position: relative; line-height: 0; }

      /* The column the panels stack in. Made by src/ui/panel.ts, not written
         here, so adding a panel is one call and nothing else. */
      #chrome {
        position: absolute;
        top: 4px;
        right: 4px;
        /* Legible from three metres on a display the art has room to grow into
           (MAZE-051). `--ui` is a whole number set by applyLayout from the same
           integer scale the canvas uses — 1 on a phone and a windowed desktop,
           2 at 1080p, 4 at 4K — so the panel keeps a fixed relationship to the
           picture beside it instead of to a guess at the viewer's distance,
           which is the platform question this project does not ask.

           `zoom` and not a font-size: the panel is 11 px type, 1 px borders,
           hand-tuned column widths and 44 px coarse-pointer targets, and every
           one of those has to grow together or the box comes apart. Scaling
           each by hand would be a dozen chances to miss one. It is applied
           HERE, on the column, rather than on #stage — zooming the stage would
           take the canvas with it and break the integer scaling the whole
           project rests on. */
        zoom: var(--ui, 1);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }

      /* Interface chrome, deliberately outside the pixel-art scaling: real
         controls, kept small and dim so they do not compete with the art.
         Keyed off the data attribute rather than off one panel's id, so every
         panel is styled by these rules. See src/ui/panel.ts for why this is
         HTML and not drawn. */
      [data-chrome] {
        line-height: 1;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--dm-c-text, #8a8a94);
        text-align: right;
      }
      [data-chrome] .bar { display: flex; gap: 2px; justify-content: flex-end; }
      [data-chrome] .glyph {
        font: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 3px 5px;
        color: inherit;
        background: var(--dm-c-panel, rgba(10, 10, 14, 0.55));
        border: 1px solid var(--dm-c-border, #26262e);
        border-radius: 2px;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 120ms linear;
      }
      /* A drawn 1-bit icon, masked so it takes `currentColor` (MAZE-098).
         The mask is on this span and never on the button: a mask clips
         everything an element paints, so masking the button would cut its
         border and background to the shape of a speaker. `mask-image` itself is
         set inline by `ui/icons.ts`, which is where the picture lives. 12px is
         half the 24px the mask is blitted at, so it lands 1:1 on a 2x screen and
         halves exactly on a 1x one — the two ratios at which a bitmap stays
         sharp. */
      [data-chrome] .glyph.has-icon { display: inline-flex; align-items: center; justify-content: center; }
      [data-chrome] .glyph .ico {
        display: block;
        width: 12px;
        height: 12px;
        background-color: currentColor;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: 12px 12px;
        mask-size: 12px 12px;
      }
      [data-chrome]:hover .glyph, [data-chrome]:focus-within .glyph { opacity: 1; }
      [data-chrome].is-muted .glyph { opacity: 1; color: var(--dm-c-alert, #c2504a); }
      [data-chrome] .glyph:focus-visible { outline: 1px solid var(--dm-c-border-hi, #6a6a7a); opacity: 1; }

      [data-chrome] .panel {
        margin-top: 3px;
        padding: 6px 7px;
        background: var(--dm-c-panel-solid, rgba(10, 10, 14, 0.88));
        border: 1px solid var(--dm-c-border, #26262e);
        border-radius: 2px;
      }
      [data-chrome] .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
      [data-chrome] .name { width: 66px; text-align: left; }
      [data-chrome] .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
      [data-chrome] input[type="range"] { width: 84px; accent-color: var(--dm-c-accent, #6a6a7a); cursor: pointer; }
      [data-chrome] select {
        font: inherit;
        width: 84px;
        color: var(--dm-c-bright, #b4b4be);
        background: var(--dm-c-bg, #14141a);
        border: 1px solid var(--dm-c-border, #33333d);
        border-radius: 2px;
        cursor: pointer;
      }
      /* A push button in a row: an ACTION rather than a setting (MAZE-067).
         Sized and coloured off the `select` above rather than invented, so the
         rows in a panel line up whatever kind of control they hold. */
      [data-chrome] .push {
        font: inherit;
        width: 84px;
        color: var(--dm-c-bright, #b4b4be);
        background: var(--dm-c-bg, #14141a);
        border: 1px solid var(--dm-c-border, #33333d);
        border-radius: 2px;
        cursor: pointer;
        padding: 1px 0;
      }
      [data-chrome] .push:hover { border-color: var(--dm-c-border-hi, #55555f); color: var(--dm-c-bright, #d8d8e2); }
      /* Why the current choice exists. Dim and wrapped — it is there to be read
         once while deciding, not to compete with the maze afterwards. */
      [data-chrome] .blurb {
        display: block;
        max-width: 152px;
        margin: 1px 0 0 auto;
        color: var(--dm-c-dim, #5c5c66);
        font-size: 10px;
        line-height: 1.35;
        text-align: right;
      }

      /* A note that is a STANDING FACT about the game rather than an
         explanation of the choice above it (MAZE-085). It needs separating from
         the track blurb: rendered without this the two ran together as one
         right-aligned paragraph and there was no telling where one ended. */
      [data-chrome] .blurb.standing {
        margin-top: 7px;
        padding-top: 6px;
        border-top: 1px solid var(--dm-c-line, #2a2a31);
      }

      /* ---- The on-screen controls (MAZE-005) --------------------------------
         Deliberately outside the pixel-art scaling, like the sound panel: these
         are controls, not art. They are the whole closed control set and no
         more — step, step back, turn, turn, and hold to sneak.

         `touch-action: none` is the load-bearing line. Without it a thumb on a
         button also scrolls the page, pinches it, or double-tap-zooms the maze,
         and the game appears to have a mind of its own. The JS calls
         preventDefault as well; neither alone is complete. */
      #dpad {
        /* FIXED, so the clusters anchor to the SCREEN rather than to the canvas
           (MAZE-069). They used to hang off #stage, which shrink-wraps the
           picture — on a phone that put them 9 px apart in the middle of the
           display, the one place neither thumb reaches. The element stays a
           child of #stage; `fixed` ignores that because no ancestor establishes
           a containing block for it. */
        /* The key size, decided by the SCREEN rather than by a mode (MAZE-069,
           Vat: bigger "only if the screen size allows it, otherwise leave it as
           is"). 44px is the floor and is never given up. `vmin` is the SHORT side
           of the viewport, which is the dimension that is actually scarce: in
           portrait that is the width the two clusters share, in landscape it is the
           height the turns cluster stands in. At 15vmin a short side of 320 CSS px
           or more earns the full 48px and anything under ~293 stays at 44 — 320 is
           the narrowest phone anyone still ships, not a tuned number. */
        --key: clamp(44px, 15vmin, 48px);
        position: fixed;
        inset: 0;
        /* The container must not eat taps meant for the canvas underneath — the
           game-over screen is dismissed by tapping anywhere. Only the buttons
           themselves are targets. */
        pointer-events: none;
        touch-action: none;
      }
      #dpad[hidden] { display: none; }

      #dpad .pad {
        position: absolute;
        bottom: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      /* Kept clear of the system gesture areas — the home indicator, the rounded
         corners and a notch in landscape. `viewport-fit=cover` lets the page use
         the whole screen, which also means it can put a button somewhere the OS
         will take the touch instead. */
      #dpad .pad { bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
      #dpad .steps { left: calc(6px + env(safe-area-inset-left, 0px)); }
      #dpad .turns { right: calc(6px + env(safe-area-inset-right, 0px)); }
      #dpad .row { display: flex; gap: 6px; }

      /* Both clusters share the bottom baseline; sneak stacks above the turn
         pair rather than pushing it up off the corner. */
      #dpad .key {
        display: flex;
        align-items: center;
        justify-content: center;
        /* 44px is the smallest target a thumb hits reliably, and `--key` only
           ever grows it — see #dpad. The art scales in whole numbers and this
           does not: a control that is hard to press is a worse failure than one
           that is a pixel off the grid. */
        min-width: var(--key);
        min-height: var(--key);
        padding: 0 8px;
        font: 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--dm-c-text, #8a8a94);
        background: var(--dm-c-panel, rgba(10, 10, 14, 0.55));
        border: 1px solid var(--dm-c-border, #26262e);
        border-radius: 3px;
        cursor: pointer;
        opacity: 0.45;
        transition: opacity 120ms linear;
        touch-action: none;
      }
      #dpad .key[data-key="sneak"] { font-size: 10px; letter-spacing: 0.08em; }

      /* THE FOUR ARROWS ARE DRAWN, NOT TYPED (MAZE-088).
         They used to be `▲ ▼ ◀ ▶`. On Android the turn pair rendered as
         full-colour blue emoji while the step pair stayed grey text, because
         U+25C0 and U+25B6 have an emoji presentation variation sequence defined
         and U+25B2 and U+25BC do not — so a font is entitled to pick a picture
         for two of the four. Asking for text with U+FE0E (VARIATION SELECTOR-15)
         was tried first and Android 10 / Chrome 138 ignored it.
         No character, no font, no font's opinion. One triangle rotated four ways,
         so the arrows also match each other exactly, which they never quite did.
         `currentColor` inherits the key's colour, so they dim, brighten with
         `.is-down`, and follow the video mode's palette for free. */
      #dpad .key .arrow {
        width: 0;
        height: 0;
        border-style: solid;
        /* Zero top border: the triangle fills its 14x12 box, so all four
           rotations stay centred in the key. A 7px-all-round triangle would
           sit in the bottom half and flip to the top half at 180deg. */
        border-width: 0 7px 12px 7px;
        border-color: transparent transparent currentColor transparent;
      }
      #dpad .key[data-key="back"] .arrow { transform: rotate(180deg); }
      #dpad .key[data-key="left"] .arrow { transform: rotate(-90deg); }
      #dpad .key[data-key="right"] .arrow { transform: rotate(90deg); }

      /* Dim until touched, so they do not compete with a corridor whose whole
         subject is how little light there is. */
      #dpad:hover .key, #dpad .key:focus-visible { opacity: 0.75; }
      #dpad .key.is-down {
        opacity: 1;
        color: var(--dm-c-bright, #d4d4de);
        background: var(--dm-c-key-down, rgba(40, 40, 52, 0.9));
      }
      #dpad .key:focus-visible { outline: 1px solid var(--dm-c-border-hi, #6a6a7a); }

      /* A thumb is not a mouse pointer. The panels are sized for a cursor — an
         11 px glyph is a comfortable click and an unhittable tap — so on a
         coarse pointer the TARGET grows while the type stays where it is. Keyed
         off the input device rather than off screen width or a user-agent test,
         for the same reason the D-pad and the keyboard are both always live:
         input is a capability, not a platform (MAZE-005). A tablet with a
         stylus and a laptop with a touchscreen both land correctly here. */
      @media (pointer: coarse) {
        [data-chrome] .glyph {
          min-width: 44px;
          min-height: 44px;
          padding: 3px 5px;
          opacity: 0.75;
        }
        [data-chrome] input[type="range"] { width: 110px; height: 28px; }
        [data-chrome] select { height: 32px; }
      }
